<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linkscope · AI Website Intelligence</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔭</text></svg>">
<style>
:root{--bg:#0f0a1f;--card:#1a1233;--card2:#221848;--text:#f3efff;--mut:#a79fcb;--line:#33275f;
--g1:#ff4d8d;--g2:#7c4dff;--g3:#00d4ff;--ok:#2ee6a6;--warn:#ffc857;--grad:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3))}
:root[data-theme=light]{--bg:#f6f3ff;--card:#fff;--card2:#f0ebff;--text:#1d1540;--mut:#6a6296;--line:#ddd3ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(600px 400px at 10% -5%,#ff4d8d33,transparent),radial-gradient(700px 500px at 95% 10%,#00d4ff26,transparent),radial-gradient(600px 500px at 50% 110%,#7c4dff33,transparent);pointer-events:none}
.app{position:relative;display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 16px;background:color-mix(in srgb,var(--card) 70%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:800;font-size:22px;display:flex;gap:10px;align-items:center;margin-bottom:22px}
.logo i{font-style:normal;width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center}
.logo span,h1 em{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:normal}
aside h4{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.hist{padding:10px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;display:flex;justify-content:space-between;gap:8px;align-items:center}
.hist:hover,.hist.on{background:var(--card2);border-color:var(--line)}
.hist b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}.hist small{color:var(--mut);font-size:12px}
.hist button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}.hist button:hover{color:var(--g1)}
main{padding:34px clamp(16px,4vw,48px);max-width:1150px;width:100%}
.top{display:flex;justify-content:flex-end;gap:10px;margin-bottom:6px;align-items:center}
.pill{font-size:12px;padding:6px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.pill.ok::before{content:"● ";color:var(--ok)}.pill.bad::before{content:"● ";color:var(--g1)}
.icon{cursor:pointer;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:6px 12px}
h1{font-size:clamp(30px,5vw,50px);line-height:1.05;margin:10px 0 10px;letter-spacing:-.03em}
.sub{color:var(--mut);max-width:620px;margin:0 0 24px;font-size:17px}
.bar{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);padding:8px;border-radius:18px;box-shadow:0 10px 40px #7c4dff22}
.bar input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:17px;padding:10px 14px;min-width:0}
.go{border:0;color:#fff;font-weight:700;font-size:16px;padding:0 26px;border-radius:12px;background:var(--grad);cursor:pointer;transition:.2s}
.go:hover{transform:translateY(-1px);filter:brightness(1.1)}.go:disabled{opacity:.6;cursor:wait}
.opts{display:flex;gap:16px;margin:10px 4px 0;color:var(--mut);font-size:13px;align-items:center}
.err{margin-top:18px;padding:14px 18px;border-radius:14px;background:#ff4d8d22;border:1px solid var(--g1)}
.load{margin:40px 0;text-align:center;color:var(--mut)}.orb{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;background:var(--grad);animation:sp 1.1s linear infinite;mask:radial-gradient(circle 22px,transparent 98%,#000);-webkit-mask:radial-gradient(circle 22px,transparent 98%,#000)}
@keyframes sp{to{transform:rotate(360deg)}}
.hero{margin-top:30px;padding:24px;border-radius:22px;background:var(--grad);color:#fff;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
.hero h2{margin:0 0 6px;font-size:28px}.hero p{margin:0;max-width:640px;opacity:.95}
.tag{display:inline-block;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600;background:#ffffff30;margin:0 6px 6px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 16px}
.tab{padding:10px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--mut);cursor:pointer;font-weight:600;font-size:14px}
.tab.on{color:#fff;background:var(--grad);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--g2))}
.card h3{margin:0 0 8px;font-size:17px}.card p{margin:6px 0;color:var(--mut);font-size:14px;line-height:1.5}.card p b{color:var(--text)}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;margin:3px 4px 3px 0;background:var(--card2);border:1px solid var(--line)}
.chip.p{background:#7c4dff33}.chip.g{background:#2ee6a633}.chip.y{background:#ffc85733}.chip.b{background:#00d4ff2e}
.sec{margin:22px 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:16px;overflow:hidden;font-size:14px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--card2);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.scroll{overflow-x:auto}.ai{font-size:12px;color:var(--warn)}
.serp{background:#fff;color:#202124;border-radius:14px;padding:16px;max-width:640px}.serp .u{font-size:13px;color:#4d5156}.serp .t{font-size:20px;color:#1a0dab;margin:3px 0}.serp .d{font-size:14px;color:#4d5156}
.btn{cursor:pointer;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600}
.empty{color:var(--mut);padding:30px 0;text-align:center}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
<aside><div class="logo"><i>🔭</i><div>Link<span>scope</span></div></div><h4>Recent analyses</h4><div id="hist"></div></aside>
<main>
  <div class="top"><span class="pill" id="status">checking…</span><button class="icon" id="theme" aria-label="Toggle theme">🌗</button></div>
  <h1>See any website through <em>an analyst's eyes</em></h1>
  <p class="sub">Paste a URL. Get competitors, search queries, SEO fixes, top services and target audiences in seconds.</p>
  <div class="bar"><input id="url" placeholder="https://yourwebsite.com" autocomplete="off"><button class="go" id="go">Analyze →</button></div>
  <div class="opts"><label><input type="checkbox" id="force"> Skip cache (re-run analysis)</label></div>
  <div id="out"></div>
</main>
</div>
<script>
const $=s=>document.querySelector(s);let cur=null,tab="comp",curId=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const chips=(a,cls="")=>(a||[]).map(x=>`<span class="chip ${cls}">${esc(x)}</span>`).join("")||'<span class="ai">—</span>';
const list=a=>(a||[]).map(x=>`<p>• ${esc(x)}</p>`).join("")||"<p>—</p>";
$("#theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"":"light";try{localStorage.t=r.dataset.theme}catch(e){}};
try{if(localStorage.t)document.documentElement.dataset.theme=localStorage.t}catch(e){}
fetch("/health").then(r=>r.json()).then(h=>{const s=$("#status");s.textContent=h.llm_configured?`${h.provider} · ${h.model}`:`${h.provider}: API key missing`;s.className="pill "+(h.llm_configured?"ok":"bad")}).catch(()=>{});
async function loadHist(){const {items}=await (await fetch("/api/history")).json();
 $("#hist").innerHTML=items.length?items.map(i=>`<div class="hist ${i.id===curId?"on":""}" data-id="${i.id}"><div><b>${esc(i.brand||i.url)}</b><small>${esc(new URL(i.url).hostname)} · ${new Date(i.created_at).toLocaleDateString()}</small></div><button data-del="${i.id}" title="Delete">✕</button></div>`).join(""):'<div class="empty">Nothing yet</div>'}
$("#hist").onclick=async e=>{const d=e.target.dataset.del;if(d){await fetch("/api/history/"+d,{method:"DELETE"});if(+d===curId){$("#out").innerHTML="";curId=null}return loadHist()}
 const h=e.target.closest(".hist");if(h){const r=await fetch("/api/history/"+h.dataset.id);show(await r.json())}};
async function run(){const url=$("#url").value.trim();if(!url)return;
 $("#go").disabled=true;$("#out").innerHTML='<div class="load"><div class="orb"></div>Reading the site and thinking… this takes 10–40 seconds.</div>';
 try{const r=await fetch("/link-analysis",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url,force_refresh:$("#force").checked})});
  const j=await r.json();if(!r.ok||!j.success)throw new Error(j.error?.message||j.detail||"Something went wrong.");show(j)}
 catch(e){$("#out").innerHTML=`<div class="err"><b>Couldn't analyze that site.</b><br>${esc(e.message)}</div>`}
 $("#go").disabled=false}
$("#go").onclick=run;$("#url").onkeydown=e=>e.key==="Enter"&&run();
function show(d){cur=d;curId=d.id;tab="comp";render();loadHist()}
const TABS=[["comp","⚔️ Competitors"],["q","🔎 Search queries"],["seo","📈 SEO"],["svc","🧩 Top services"],["aud","🎯 Audience"]];
function render(){const d=cur,a=d.analysis,m=d.meta||{};
 $("#out").innerHTML=`<div class="hero"><div><h2>${esc(d.brand.name||d.website)}</h2><p>${esc(d.brand.summary)}</p></div><div><span class="tag">${esc(d.brand.category)}</span><span class="tag">${d.cached?"⚡ cached":"✨ fresh"}</span><span class="tag">${esc(m.model||"")}</span><span class="tag">${m.latency_ms?(m.latency_ms/1000).toFixed(1)+"s":""}</span><br><button class="btn" id="dl">⬇ Export JSON</button></div></div>
 <div class="tabs">${TABS.map(([k,l])=>`<div class="tab ${k===tab?"on":""}" data-t="${k}">${l}</div>`).join("")}</div><div id="pane"></div>
 <p class="ai">${esc(m.note||"")}</p>`;
 $("#dl").onclick=()=>{const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});const l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="analysis.json";l.click()};
 document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{tab=t.dataset.t;render()});pane()}
function pane(){const a=cur.analysis,p=$("#pane");
 if(tab==="comp"){const c=a.competitor_analysis;const rows=[["Brand",cur.brand.name,...c.competitors.map(x=>x.name)],["Main service",(c.main_products_services||[]).slice(0,2).join(", "),...c.competitors.map(x=>x.main_service)],["Target market","—",...c.competitors.map(x=>x.target_market)],["Key strength",(c.strengths||[])[0]||"—",...c.competitors.map(x=>x.key_strength)],["Gap / weakness","Opportunity: "+((c.opportunities||[])[0]||"—"),...c.competitors.map(x=>(x.weaknesses||[])[0]||"—")]];
  p.innerHTML=`<p>${esc(c.brand_overview)}</p><div class="sec">Comparison <span class="ai">· competitors are AI-generated suggestions</span></div><div class="scroll"><table><tr><th></th>${["Your brand",...c.competitors.map(x=>x.name)].map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td>${r.slice(1).map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div>
  <div class="grid" style="margin-top:16px"><div class="card" style="--c:var(--ok)"><h3>Your strengths</h3>${list(c.strengths)}</div><div class="card" style="--c:var(--g3)"><h3>Competitive advantages</h3>${list(c.competitive_advantages)}</div><div class="card" style="--c:var(--warn)"><h3>Positioning opportunities</h3>${list(c.opportunities)}</div></div>
  <div class="sec">Competitor details</div><div class="grid">${c.competitors.map(x=>`<div class="card" style="--c:var(--g1)"><h3>${esc(x.name)}</h3><p>${esc(x.website||"")}</p><p><b>Strength:</b> ${esc(x.key_strength)}</p><p><b>Gaps:</b> ${esc((x.weaknesses||[]).join("; "))}</p></div>`).join("")}</div>`}
 if(tab==="q")p.innerHTML=`<div class="grid">${a.target_search_queries.map((q,i)=>`<div class="card" style="--c:${["var(--g1)","var(--g2)","var(--g3)","var(--ok)","var(--warn)"][i%5]}"><h3>“${esc(q.query)}”</h3><div>${chips(q.platforms,"b")}</div><p><b>Intent:</b> ${esc(q.intent)}</p><p><b>Why it matters:</b> ${esc(q.business_relevance)}</p><p><b>Audience:</b> ${esc(q.target_audience)}</p></div>`).join("")}</div><p class="ai">No search-volume data is shown because none is sourced.</p>`;
 if(tab==="seo"){const s=a.seo_improvements;p.innerHTML=`<div class="sec">Google preview</div><div class="serp"><div class="u">${esc(cur.website)}</div><div class="t">${esc(s.recommended_title)}</div><div class="d">${esc(s.meta_description)}</div></div><p class="ai">Title ${(s.recommended_title||"").length} chars · Description ${(s.meta_description||"").length} chars</p>
  <div class="grid"><div class="card" style="--c:var(--g1)"><h3>Primary keyword</h3>${chips([s.primary_keyword],"p")}<p>${esc(s.title_structure)}</p></div><div class="card" style="--c:var(--g2)"><h3>Secondary</h3>${chips(s.secondary_keywords,"b")}</div><div class="card" style="--c:var(--g3)"><h3>Long-tail</h3>${chips(s.long_tail_keywords,"g")}</div><div class="card" style="--c:var(--warn)"><h3>Business keywords</h3>${chips(s.business_keywords,"y")}</div></div>
  <div class="sec">Supporting content to create</div><div class="grid">${(s.supporting_content||[]).map(c=>`<div class="card"><span class="chip p">${esc(c.type)}</span><h3>${esc(c.title)}</h3><p>${esc(c.reason)}</p></div>`).join("")}</div>`}
 if(tab==="svc")p.innerHTML=`<div class="grid">${a.top_services.map((s,i)=>`<div class="card" style="--c:${["var(--g1)","var(--g2)","var(--g3)","var(--ok)","var(--warn)"][i%5]}"><h3>${i+1}. ${esc(s.name)}</h3><span class="chip ${s.source==="website"?"g":"y"}">${s.source==="website"?"from website":"inferred"}</span><p>${esc(s.description)}</p><p><b>Industry:</b> ${esc(s.target_industry)}</p><p><b>Customer:</b> ${esc(s.target_customer)}</p><p><b>Benefit:</b> ${esc(s.main_benefit)}</p></div>`).join("")}</div>`;
 if(tab==="aud"){const t=a.target_audience;p.innerHTML=`<div class="grid"><div class="card" style="--c:var(--g1)"><h3>Primary audience</h3>${chips(t.primary_audience,"p")}</div><div class="card" style="--c:var(--g2)"><h3>Secondary audience</h3>${chips(t.secondary_audience,"b")}</div><div class="card" style="--c:var(--g3)"><h3>Industries</h3>${chips(t.industries,"g")}</div><div class="card" style="--c:var(--ok)"><h3>Business types</h3>${chips(t.business_types)}</div><div class="card" style="--c:var(--warn)"><h3>Location focus</h3><p>${esc(t.geographic_focus||"Not specified")}</p></div><div class="card" style="--c:var(--g1)"><h3>Interests</h3>${chips(t.interests,"y")}</div></div>
  <div class="grid" style="margin-top:14px"><div class="card"><h3>Customer profiles</h3>${list(t.customer_profiles)}</div><div class="card"><h3>Needs & challenges</h3>${list(t.customer_needs)}</div><div class="card"><h3>Marketing segments</h3>${list(t.marketing_segments)}</div></div>`}}
loadHist();
</script>
</body>
</html>
